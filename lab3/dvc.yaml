stages:
  download_data:
    cmd: python src/training/download_data.py
    params:
      - pipeline.data.kaggle_competition
      - pipeline.data.raw_data_path
    outs:
      - data/raw/train.csv

  process_data:
    cmd: python src/training/process_data.py
    deps:
      - data/raw/train.csv
      - src/training/process_data.py
    params:
      - pipeline.data
    outs:
      - data/processed/titanic-train.parquet
      - data/processed/titanic-test.parquet

  train:
    cmd: python src/training/train.py
    deps:
      - data/processed/titanic-train.parquet
      - src/training/train.py
    params:
      - pipeline.model
    outs:
      - models/

  evaluate:
    cmd: python src/training/evaluate.py
    deps:
      - data/processed/titanic-test.parquet
      - models/
      - src/training/evaluate.py
    params:
      - pipeline.model.reports_path
    metrics:
      - reports/evaluation_report.json:
          cache: false